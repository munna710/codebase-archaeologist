spring.application.name=codebasearchaeologist

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}

#spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

openai.api.key=${OPENROUTER_API_KEY}
openai.api.url=https://openrouter.ai/api/v1
openai.model=openrouter/free

ollama.api.url=http://localhost:11434/api/embeddings
ollama.embedding.model=nomic-embed-text
ollama.embedding.dimensions=768

spring.jpa.properties.hibernate.type.preferred_array_jdbc_type=vector
